<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Тестирование по билетам</title>
    <style>
        :root {
            --bg-color: #f0fdf4;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --primary: #4F46E5;
            --primary-hover: #4338ca;
            --correct: #10b981;
            --wrong: #ef4444;
            --border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 100%;
            max-width: 600px;
            padding: 32px;
            text-align: center;
        }

        .icon-container {
            background-color: #e0e7ff;
            color: var(--primary);
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 16px;
        }

        h1 {
            font-size: 24px;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        button.btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }

        button.btn:hover {
            background-color: var(--primary-hover);
        }

        button.btn:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Quiz UI */
        #quiz-screen, #result-screen {
            display: none;
            text-align: left;
        }

        .ticket-badge {
            display: inline-block;
            background: #e0e7ff;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 16px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .option-btn {
            background: #f9fafb;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            text-align: left;
            font-size: 15px;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: #f0fdfa;
        }

        .option-btn.correct {
            background-color: #d1fae5;
            border-color: var(--correct);
            color: #065f46;
        }

        .option-btn.wrong {
            background-color: #fee2e2;
            border-color: var(--wrong);
            color: #991b1b;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .stats {
            text-align: center;
            font-size: 16px;
            margin-bottom: 24px;
            color: var(--text-muted);
        }
        
        .result-title {
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Экран приветствия -->
    <div class="container" id="welcome-screen">
        <div class="icon-container">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path>
            </svg>
        </div>
        <h1>Тестирование по билетам</h1>
        <p class="subtitle">Единые правила безопасности при взрывных работах</p>
        <button class="btn" id="start-btn">Начать тест</button>
    </div>

    <!-- Экран вопросов -->
    <div class="container" id="quiz-screen">
        <div class="ticket-badge" id="ticket-info">Билет № 1</div>
        <div class="question-text" id="question-text">Текст вопроса</div>
        <div class="options-container" id="options-container">
            <!-- Кнопки с ответами генерируются через JS -->
        </div>
        <button class="btn" id="next-btn" style="display: none;">Следующий вопрос</button>
    </div>

    <!-- Экран результатов -->
    <div class="container" id="result-screen">
        <div class="icon-container" style="background-color: #d1fae5; color: var(--correct);">
            <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>
        <h1 class="result-title">Тест завершен!</h1>
        <p class="stats" id="final-score">Вы ответили правильно на X из Y вопросов.</p>
        <button class="btn" id="restart-btn">Пройти заново</button>
    </div>

    <script>
        // База вопросов (индекс правильного ответа 'correct' начинается с 0, при необходимости исправьте на нужный)
        const questions = [
            // БИЛЕТ № 1
            {
                ticket: "БИЛЕТ № 1",
                text: "1. Какое из перечисленных требований при применении средств инициирования запрещается?",
                options: [
                    "А) При изготовлении промежуточных детонаторов из порошкообразных патронированных ВВ с применением детонирующего шнура конец шнура складывать вдвое.",
                    "Б) Расширять гнёзда патронов (шашек) заводского изготовления, из которых изготовлены боевики.",
                    "В) Обматывать детонирующий шнур вокруг патрона взрывчатых веществ.",
                    "Г) При изготовлении промежуточных детонаторов конец детонирующего шнура в патроне завязывать узлом.",
                    "Д) Все ответы неверны."
                ],
                correct: 1
            },
            {
                ticket: "БИЛЕТ № 1",
                text: "2. При каком условии разрешается выход взрывника из укрытия после взрыва при взрывании с применением электродетонаторов?",
                options: [
                    "А) После отсоединения электровзрывной сети от источника тока и замыкания её накоротко.",
                    "Б) Не ранее чем через 5 мин.",
                    "В) После проветривания.",
                    "Г) При выполнении всех перечисленных условий.",
                    "Д) Все ответы неверны."
                ],
                correct: 3
            },
            {
                ticket: "БИЛЕТ № 1",
                text: "3. Какой документ служит для отпуска взрывчатых материалов взрывникам для производства взрывных работ?",
                options: ["А) Акт-допуск.", "Б) Наряд-путёвка.", "В) Наряд-накладная.", "Г) Наряд-допуск.", "Д) Все ответы неверны."],
                correct: 1
            },
            {
                ticket: "БИЛЕТ № 1",
                text: "4. Какое из перечисленных требований к уничтожению взрывчатых материалов указано верно?",
                options: [
                    "А) Допускается применение смёрзшихся ВВ, содержащих жидкие нитроэфиры 20 %.",
                    "Б) Уничтожение ВМ должно выполняться взрывниками под контролем технического руководителя организации.",
                    "В) Запрещается подход к месту сжигания до полного прекращения горения костра.",
                    "Г) Взрывчатые материалы допускается сжигать в их таре в соответствии с руководством.",
                    "Д) Все ответы неверны."
                ],
                correct: 2
            },
            {
                ticket: "БИЛЕТ № 1",
                text: "5. Какими должны быть действия взрывника, если при подаче напряжения взрыва не произошло?",
                options: [
                    "А) Отсоединить от источника тока сеть, замкнуть накоротко концы, взять ключ и только после выяснить причину.",
                    "Б) Отсоединить сеть, взять ключ и выяснить причину.",
                    "В) Отсоединить сеть и проверить ее электрическое сопротивление.",
                    "Г) Периодически подать напряжение, при отсутствии взрыва отключить прибор, взять ключ и выяснить причину."
                ],
                correct: 0
            },
            
            // БИЛЕТ № 3 (сокращенный блок для примера структуры, добавлены первые 3)
            {
                ticket: "БИЛЕТ № 3",
                text: "1. В каком из перечисленных случаев у взрывника может быть изъята Единая книжка взрывника?",
                options: [
                    "А) За нарушения требований охраны труда при выполнении взрывных работ.",
                    "Б) За неоднократные нарушения режима рабочего времени.",
                    "В) За появление на рабочем месте в состоянии алкогольного опьянения.",
                    "Г) За нарушение установленного порядка хранения, транспортирования, использования ВМ, приведшее к аварии."
                ],
                correct: 3
            },
            {
                ticket: "БИЛЕТ № 3",
                text: "2. Какой из перечисленных индексов, наносимый на гильзы электродетонаторов и капсюлей-детонаторов, обозначает номер взрывника?",
                options: [
                    "А) Два буквенных индекса слева от цифровых.",
                    "Б) Два буквенных индекса справа от цифровых.",
                    "В) Два цифровых индекса.",
                    "Г) Три буквенных индекса справа от цифровых.",
                    "Д) Все ответы неверны."
                ],
                correct: 0
            },
            
            // БИЛЕТ № 4
            {
                ticket: "БИЛЕТ № 4",
                text: "1. С какой периодичностью должны проверяться знания требований безопасности работниками, имеющими Единую книжку взрывника?",
                options: [
                    "А) Не реже одного раза в три года.",
                    "Б) Не реже одного раза в год.",
                    "В) Не реже одного раза в два года.",
                    "Г) Все ответы неверны.",
                    "Д) Не реже одного раза в пять лет."
                ],
                correct: 2
            },
            
            // БИЛЕТ № 5
            {
                ticket: "БИЛЕТ № 5",
                text: "1. Через какое время разрешается подход взрывника к месту взрыва, если взрыва не произошло?",
                options: [
                    "А) Не ранее чем через 5 мин.",
                    "Б) Не ранее чем через 10 мин.",
                    "В) Не ранее чем через 15 мин.",
                    "Г) С разрешения руководителя взрывных работ.",
                    "Д) Все ответы неверны."
                ],
                correct: 2
            },
            
            // БИЛЕТ № 6
            {
                ticket: "БИЛЕТ № 6",
                text: "2. Какую массу взрывчатых материалов допускается переносить взрывнику при одновременной доставке вручную средств инициирования и взрывчатых веществ?",
                options: [
                    "А) Не более 10 кг.",
                    "Б) Не более 20 кг.",
                    "В) Не более 14 кг.",
                    "Г) Не более 16 кг."
                ],
                correct: 1
            },
            
            // БИЛЕТ № 7
            {
                ticket: "БИЛЕТ № 7",
                text: "1. В течение какого времени должна проводиться стажировка взрывников перед допуском к самостоятельному производству взрывных работ?",
                options: [
                    "А) В течение 15 дней.",
                    "Б) В течение одного месяца.",
                    "В) В течение двух месяцев.",
                    "Г) В течение трех месяцев.",
                    "Д) Все ответы неверны."
                ],
                correct: 1
            }
        ];

        // Логика приложения
        let currentQuestionIndex = 0;
        let score = 0;

        const welcomeScreen = document.getElementById('welcome-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        
        const startBtn = document.getElementById('start-btn');
        const nextBtn = document.getElementById('next-btn');
        const restartBtn = document.getElementById('restart-btn');
        
        const ticketInfo = document.getElementById('ticket-info');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const finalScore = document.getElementById('final-score');

        // Запуск теста
        startBtn.addEventListener('click', () => {
            welcomeScreen.style.display = 'none';
            quizScreen.style.display = 'block';
            currentQuestionIndex = 0;
            score = 0;
            loadQuestion();
        });

        // Загрузка вопроса
        function loadQuestion() {
            nextBtn.style.display = 'none';
            optionsContainer.innerHTML = '';
            
            const currentQuestion = questions[currentQuestionIndex];
            ticketInfo.textContent = currentQuestion.ticket + " (Вопрос " + (currentQuestionIndex + 1) + " из " + questions.length + ")";
            questionText.textContent = currentQuestion.text;

            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement('button');
                button.className = 'option-btn';
                button.textContent = option;
                button.addEventListener('click', () => selectAnswer(index, button, currentQuestion.correct));
                optionsContainer.appendChild(button);
            });
        }

        // Выбор ответа
        function selectAnswer(selectedIndex, selectedButton, correctIndex) {
            const allButtons = optionsContainer.querySelectorAll('.option-btn');
            
            // Блокируем все кнопки после выбора
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === correctIndex) {
                selectedButton.classList.add('correct');
                score++;
            } else {
                selectedButton.classList.add('wrong');
